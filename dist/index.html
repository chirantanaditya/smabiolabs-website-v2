        initials: "ER"
      },
      { placeholder: true, slot: "Testimonial slot 3 — add client quote" },
      { placeholder: true, slot: "Testimonial slot 4 — add client quote" }
    ];
    const n = slides.length;
    const i = (this.state && this.state.i) || 0;
    const s = slides[i];
    const pad = (k) => (k < 10 ? "0" : "") + k;
    return {
      cur: {
        quote: s.quote || "",
        name: s.name || "",
        role: s.role || "",
        initials: s.initials || "",
        slot: s.slot || "",
        real: !s.placeholder,
        ph: !!s.placeholder
      },
      counter: pad(i + 1),
      total: pad(n),
      prev: () => this.setState({ i: (i - 1 + n) % n }),
      next: () => this.setState({ i: (i + 1) % n }),
      dots: slides.map((x, k) => ({
        on: k === i,
        off: k !== i,
        label: "Show testimonial " + (k + 1),
        pick: () => this.setState({ i: k })
      }))
    };
  }
}
</script>

<script>
const homeFold = document.querySelector('.home-fold');
function sizeHomeFold() {
  const top = homeFold.getBoundingClientRect().top + window.scrollY;
  homeFold.style.setProperty('--home-fold-top', top + 'px');
}
sizeHomeFold();
window.addEventListener('resize', sizeHomeFold);
new ResizeObserver(sizeHomeFold).observe(document.querySelector('header'));
</script>
<script>
{
  const toggle = document.querySelector('.menu-toggle');
  const nav = document.getElementById('primary-navigation');
  function setMenu(open) {
    toggle.setAttribute('aria-expanded', String(open));
    toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  }
  toggle.addEventListener('click', () => setMenu(toggle.getAttribute('aria-expanded') === 'false'));
  toggle.closest('header').addEventListener('keydown', event => {
    if (event.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') {
      setMenu(false);
      toggle.focus();
    }
  });
  nav.addEventListener('click', event => {
    if (event.target.closest('a')) setMenu(false);
  });
}
</script>
